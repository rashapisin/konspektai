# Выпуск: при метке v* (например v1.0.1) GitHub сам собирает программу на чистой Windows, прогоняет тесты
# и самопроверку EXE и прикладывает к релизу установщик и переносной ZIP. Так любой может убедиться, что файлы
# собраны из открытого кода, — это же условие бесплатной подписи SignPath (docs/signing.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"  # консоль сервера в cp1252: без этого русские сообщения сборки падают
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Зависимости
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -r requirements-dev.txt
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python -m pytest -q
      - name: Сборка программы и установщика
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Релиз с файлами
        # по метке v* — как раньше; запуск вручную с main — метка v<версия из stv/brand.py> ставится здесь же
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build\installer -File | ForEach-Object { $_.FullName }
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
          else {
            $ver = (Select-String -Path stv\brand.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
            $tag = "v$ver"
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Релиз $tag уже есть: поднимите VERSION в stv/brand.py" }
            $global:LASTEXITCODE = 0
          }
          gh release create $tag $files --target $env:GITHUB_SHA --title "KonspektAI $($tag.TrimStart('v'))" --notes-file CHANGELOG.md
